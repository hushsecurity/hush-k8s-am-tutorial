<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hush AM Tutorial</title>
  <style>
    body { margin: 16px; font: 14px/1.4 ui-monospace, monospace; background: #fff; color: #111; }
    @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  </style>
</head>
<body>
  <p>Live status from <code>/status</code>.</p>
  <pre id="status">loading...</pre>
  <script>
    async function refresh() {
      try {
        const response = await fetch("/status", { cache: "no-store" });
        document.getElementById("status").textContent = JSON.stringify(await response.json(), null, 2);
      } catch (error) {
        document.getElementById("status").textContent = "dashboard unreachable: " + error;
      }
    }
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
