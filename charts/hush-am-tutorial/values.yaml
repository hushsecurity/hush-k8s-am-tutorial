nameOverride: ""
fullnameOverride: "hush-am-tutorial"

postgres:
  image: postgres:16
  dbName: tutorial
  rootUsername: postgres
  # Left empty, a random one is generated on install and kept on upgrades.
  rootPassword: ""
  port: 5432
  # Keep the database on a persistent volume instead of in its pod, for an
  # install left running: otherwise the database starts over empty whenever its
  # pod moves to another node, losing the logins Hush created in it. Set on
  # install; removed on uninstall.
  persistence:
    enabled: false
    # Empty for the cluster's default storage class.
    storageClass: ""
    # Postgres settles around 130MB here: the capped table, and the write-ahead
    # log it keeps for reuse (80MB). Some providers round up, EBS to 1Gi.
    size: 256Mi

client:
  image:
    repository: public.ecr.aws/z0t8l6o4/hush-k8s-am-tutorial
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  pollIntervalSeconds: 5
  # Leading characters of the injected password to print, so rotation is visible.
  secretRevealChars: 4

# Example services, each running the same client as its own service account.
# An app with a privilege is granted its own AccessPolicy with that
# AccessPrivilege; one without gets no policy from the chart.
apps:
  billing:
    privilege: readwrite-all
  analytics:
    privilege: read-all
  # For onboarding a new app: installed with no pods, until the page's step 4
  # deploys it (scales it to 1) once its policy exists in Hush.
  refunds:
    replicas: 0

# Collects the apps' reports and serves the tutorial page; reach it with
# kubectl port-forward. It holds no credentials; its only Kubernetes access is
# scaling and restarting the tutorial's apps, for the page's buttons.
dashboard:
  port: 8080
  # Where the apps send their reports: a Service of its own, inside the cluster
  # only, apart from the page's.
  reportPort: 8081
  # Host names, besides localhost, to accept the page's buttons from: for a page
  # served behind a load balancer or ingress rather than kubectl port-forward.
  # Actions sent under any other name are refused, so a site that points its own
  # name at the dashboard cannot press the buttons.
  allowedHosts: []
  # Ask for a username and password before showing the page or taking its
  # actions, for a page others can reach: the name of a Secret in the release's
  # namespace, with keys username and password. Off when empty, as through
  # kubectl port-forward only those with access to the cluster reach it. Serve
  # such a page over HTTPS, for example with TLS at the load balancer or
  # ingress: the password is otherwise sent in the clear.
  basicAuth:
    existingSecret: ""

hooks:
  kubectlImage: alpine/kubectl:1.33.4
  postgresReadyTimeoutSeconds: 300
  policySyncTimeoutSeconds: 120

hush:
  namespace: hush-security
  credentialName: hush-am-tutorial-postgres
  # Postgres host as seen by the Hush UAM API; defaults to the service DNS name.
  postgresHost: ""
  sslMode: disable
