apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hush-am-tutorial.postgresName" . }}-init
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "hush-am-tutorial.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "-25"
data:
  01-init.sql: |
    CREATE TABLE IF NOT EXISTS invoices (
      ref TEXT NOT NULL,
      written_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    INSERT INTO invoices (ref)
    SELECT 'seed'
    WHERE NOT EXISTS (SELECT 1 FROM invoices);

    -- Keep the newest rows only: the apps write every few seconds, so a tutorial
    -- left running would otherwise grow without end. Runs as the table's owner,
    -- whatever the privileges of the app that wrote.
    CREATE INDEX IF NOT EXISTS invoices_written_at ON invoices (written_at);

    CREATE OR REPLACE FUNCTION trim_invoices() RETURNS trigger
    LANGUAGE plpgsql SECURITY DEFINER SET search_path = public AS $$
    BEGIN
      DELETE FROM public.invoices
      WHERE written_at < (SELECT written_at FROM public.invoices ORDER BY written_at DESC OFFSET 999 LIMIT 1);
      RETURN NULL;
    END
    $$;

    CREATE OR REPLACE TRIGGER trim_invoices
    AFTER INSERT ON invoices
    FOR EACH STATEMENT EXECUTE FUNCTION trim_invoices();

