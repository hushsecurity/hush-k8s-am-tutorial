{{- if .Values.postgres.persistence.enabled }}
{{- /*
The database's volume: a hook like the Postgres Deployment, created just before
it, and removed with it by the post-delete cleanup.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hush-am-tutorial.postgresDataName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "hush-am-tutorial.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "-21"
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.postgres.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size | quote }}
{{- end }}
