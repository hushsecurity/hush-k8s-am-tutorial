apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hush-am-tutorial.postgresName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "hush-am-tutorial.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  annotations:
    # Phase (a): a hook, so the database is up before Hush applies the policies against it.
    helm.sh/hook: pre-install
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "-20"
spec:
  replicas: 1
  {{- if .Values.postgres.persistence.enabled }}
  # One pod at a time: the volume attaches to one node only.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hush-am-tutorial.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hush-am-tutorial.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgres
    spec:
      restartPolicy: Always
      securityContext:
        {{- include "hush-am-tutorial.podSecurityContext" 999 | nindent 8 }}
        fsGroup: 999
      volumes:
        - name: postgres-data
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "hush-am-tutorial.postgresDataName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: postgres-init
          configMap:
            name: {{ include "hush-am-tutorial.postgresName" . }}-init
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "hush-am-tutorial.containerSecurityContext" . | nindent 12 }}
          env:
            # A subdirectory, which the postgres user can own; the volume root it cannot.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: {{ .Values.postgres.dbName | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.rootUsername | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ include "hush-am-tutorial.postgresRootPassword" . | quote }}
          ports:
            - containerPort: {{ .Values.postgres.port }}
              name: postgres
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
