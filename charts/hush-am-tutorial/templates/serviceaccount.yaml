{{- range $app, $_ := .Values.apps }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hush-am-tutorial.appServiceAccountName" (list $ $app) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "hush-am-tutorial.name" $ }}
    helm.sh/chart: {{ include "hush-am-tutorial.chart" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/component: {{ $app }}
{{- end }}
