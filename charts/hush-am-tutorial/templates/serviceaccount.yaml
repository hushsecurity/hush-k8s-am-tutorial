apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hush-am-tutorial.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "hush-am-tutorial.name" . }}
    helm.sh/chart: {{ include "hush-am-tutorial.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
