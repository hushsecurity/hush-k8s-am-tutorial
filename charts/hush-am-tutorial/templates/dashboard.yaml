apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hush-am-tutorial.dashboardName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "hush-am-tutorial.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hush-am-tutorial.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hush-am-tutorial.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: {{ include "hush-am-tutorial.dashboardName" . }}
      securityContext:
        {{- include "hush-am-tutorial.podSecurityContext" 10001 | nindent 8 }}
      containers:
        - name: dashboard
          image: {{ include "hush-am-tutorial.clientImage" . }}
          imagePullPolicy: {{ .Values.client.image.pullPolicy }}
          securityContext:
            {{- include "hush-am-tutorial.containerSecurityContext" . | nindent 12 }}
          command: ["python"]
          args: ["dashboard.py"]
          env:
            - name: LISTEN_PORT
              value: {{ .Values.dashboard.port | quote }}
            - name: REPORT_PORT
              value: {{ .Values.dashboard.reportPort | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ .Values.client.pollIntervalSeconds | quote }}
            - name: TUTORIAL_CONFIG
              value: {{ include "hush-am-tutorial.tutorialConfig" . | quote }}
            {{- with .Values.dashboard.allowedHosts }}
            - name: ALLOWED_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.dashboard.port }}
              name: http
            - containerPort: {{ .Values.dashboard.reportPort }}
              name: reports
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hush-am-tutorial.dashboardName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "hush-am-tutorial.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dashboard
spec:
  selector:
    app.kubernetes.io/name: {{ include "hush-am-tutorial.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dashboard
  ports:
    - port: {{ .Values.dashboard.port }}
      targetPort: http
      protocol: TCP
---
{{- /* The apps' reports: inside the cluster only, apart from the page's Service. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hush-am-tutorial.dashboardName" . }}-reports
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "hush-am-tutorial.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "hush-am-tutorial.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: dashboard
  ports:
    - port: {{ .Values.dashboard.reportPort }}
      targetPort: reports
      protocol: TCP
