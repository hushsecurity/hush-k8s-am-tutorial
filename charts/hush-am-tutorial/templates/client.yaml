{{- /*
One copy of the same client per example app. Each runs as its own service
account, which is what its AccessPolicy attests.
*/}}
{{- range $app, $cfg := .Values.apps }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hush-am-tutorial.appName" (list $ $app) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "hush-am-tutorial.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $app }}
spec:
  replicas: {{ hasKey $cfg "replicas" | ternary $cfg.replicas 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hush-am-tutorial.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $app }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hush-am-tutorial.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $app }}
    spec:
      serviceAccountName: {{ include "hush-am-tutorial.appServiceAccountName" (list $ $app) }}
      restartPolicy: Always
      securityContext:
        {{- include "hush-am-tutorial.podSecurityContext" 10001 | nindent 8 }}
      containers:
        - name: client
          image: {{ include "hush-am-tutorial.clientImage" $ }}
          imagePullPolicy: {{ $.Values.client.image.pullPolicy }}
          securityContext:
            {{- include "hush-am-tutorial.containerSecurityContext" $ | nindent 12 }}
          command: ["python"]
          args: ["client.py"]
          env:
            - name: APP_NAME
              value: {{ $app | quote }}
            - name: POSTGRES_HOST
              value: {{ include "hush-am-tutorial.postgresHost" $ | quote }}
            - name: POSTGRES_PORT
              value: {{ $.Values.postgres.port | quote }}
            - name: POSTGRES_DB
              value: {{ $.Values.postgres.dbName | quote }}
            - name: POLL_INTERVAL_SECONDS
              value: {{ $.Values.client.pollIntervalSeconds | quote }}
            - name: SECRET_REVEAL_CHARS
              value: {{ $.Values.client.secretRevealChars | quote }}
            - name: DASHBOARD_URL
              value: {{ include "hush-am-tutorial.dashboardUrl" $ | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
{{- end }}
